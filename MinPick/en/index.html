<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MinPick</title>
  <meta name="description" content="Choose a task that fits the time you have now.">
  <link rel="canonical" href="https://tsukigashizumu-cmd.github.io/MinPick/en/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MinPick">
  <meta property="og:description" content="Choose a task that fits the time you have now.">
  <meta property="og:url" content="https://tsukigashizumu-cmd.github.io/MinPick/en/">
  <meta property="og:image" content="https://tsukigashizumu-cmd.github.io/MinPick/en/assets/app-icon.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f4f2ed">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f2ed;
      --card: rgba(255,255,255,.72);
      --ink: #171717;
      --muted: #6f6b65;
      --line: rgba(23,23,23,.10);
      --shadow: 0 24px 70px rgba(26,22,17,.12);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(255,255,255,.95), transparent 30%),
        linear-gradient(145deg, #f8f6f1, var(--paper));
      min-height: 100vh;
    }
    a { color: inherit; }
    .wrap { width: min(1080px, calc(100% - 36px)); margin: 0 auto; }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(18px);
      background: rgba(244,242,237,.78);
      border-bottom: 1px solid var(--line);
    }
    nav {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: -.025em;
    }
    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .storeButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 17px;
      border-radius: 999px;
      color: white;
      background: #171717;
      text-decoration: none;
      font-weight: 750;
      font-size: 14px;
    }
    main { padding: 72px 0 84px; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 66px;
      align-items: center;
    }
    .icon {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: clamp(46px, 8vw, 88px);
      line-height: .98;
      letter-spacing: -.065em;
    }
    .subtitle {
      margin: 22px 0 0;
      font-size: clamp(20px, 3vw, 30px);
      line-height: 1.3;
      letter-spacing: -.025em;
      max-width: 700px;
    }
    .promo {
      margin: 20px 0 0;
      color: var(--muted);
      line-height: 1.75;
      max-width: 700px;
      white-space: pre-line;
    }
    .heroActions { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; }
    .heroActions .storeButton { min-height: 50px; padding: 0 22px; }
    .localeMenu { position: relative; display: inline-flex; align-items: center; }
    .localeMenuSummary {
      list-style: none; display: inline-flex; align-items: center; gap: 9px;
      min-height: 50px; padding: 0 17px; border: 1px solid var(--line);
      border-radius: 999px; background: rgba(255,255,255,.68); color: var(--ink);
      font: inherit; font-size: 14px; font-weight: 760; cursor: pointer;
      user-select: none; white-space: nowrap;
    }
    .localeMenuSummary::-webkit-details-marker { display: none; }
    .localeMenuSummary::before {
      content: "文"; display: inline-grid; place-items: center; width: 25px; height: 25px;
      border-radius: 999px; background: rgba(23,23,23,.07); font-size: 12px; font-weight: 850;
    }
    .localeMenuSummary::after { content: "⌄"; opacity: .58; transform: translateY(-2px); }
    .localeMenu[open] .localeMenuSummary { background: #fff; border-color: rgba(23,23,23,.18); }
    .localeMenuList {
      position: absolute; z-index: 40; left: 0; top: calc(100% + 10px);
      width: min(350px, calc(100vw - 36px)); max-height: min(480px, calc(100vh - 150px));
      overflow: auto; padding: 8px; border: 1px solid var(--line); border-radius: 20px;
      background: rgba(255,255,255,.96); box-shadow: 0 24px 70px rgba(26,22,17,.20);
      backdrop-filter: blur(22px);
    }
    .localeMenuButton {
      width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto;
      align-items: center; gap: 14px; border: 0; border-radius: 13px; background: transparent;
      color: var(--muted); padding: 11px 12px; font: inherit; text-align: left; cursor: pointer;
    }
    .localeMenuButton:hover, .localeMenuButton:focus-visible,
    .localeMenuButton[aria-current="true"] { outline: none; background: rgba(23,23,23,.065); color: var(--ink); }
    .localeMenuLabel { min-width: 0; font-size: 14px; font-weight: 780; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .localeMenuCode { font-size: 11px; font-weight: 760; color: var(--muted); }
    html[dir="rtl"] .localeMenuList { left: auto; right: 0; }
    html[dir="rtl"] .localeMenuButton { text-align: right; }
    .featuredPhone {
      justify-self: center;
      width: min(100%, 330px);
      padding: 11px;
      border-radius: 48px;
      background: #111;
      box-shadow: 0 32px 90px rgba(15,13,10,.24);
    }
    .featuredPhone img {
      display: block;
      width: 100%;
      border-radius: 38px;
      background: #ddd;
    }
    .screens {
      margin-top: 110px;
    }
    .screensGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      align-items: start;
    }
    .phone {
      padding: 9px;
      border-radius: 38px;
      background: #111;
      box-shadow: 0 22px 62px rgba(20,17,13,.16);
    }
    .phone img {
      width: 100%;
      display: block;
      border-radius: 30px;
      background: #ddd;
    }
    .overview {
      margin-top: 108px;
      padding: clamp(25px, 6vw, 56px);
      border: 1px solid var(--line);
      border-radius: 34px;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .overview h2 {
      margin: 0 0 20px;
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: -.045em;
    }
    .description {
      color: #3f3d39;
      line-height: 1.85;
      white-space: pre-line;
      max-width: 820px;
    }
    footer {
      padding: 28px 0 42px;
      color: var(--muted);
      font-size: 13px;
    }
    .error {
      display: none;
      margin-top: 20px;
      color: #8b2e25;
      font-size: 14px;
    }
    html[dir="rtl"] body { text-align: right; }
    html[dir="rtl"] .heroActions { justify-content: flex-start; }

    @media (max-width: 780px) {
      main { padding-top: 42px; }
      .hero { grid-template-columns: 1fr; gap: 44px; }
      .featuredPhone { width: min(82vw, 330px); }
      .screens { margin-top: 78px; }
      .screensGrid { grid-template-columns: 1fr; gap: 28px; }
      .phone { width: min(82vw, 330px); margin: 0 auto; }
      .overview { margin-top: 78px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <nav>
        <a class="brand" href="./">
          <img src="assets/app-icon.png" alt="">
          <span data-field="name">MinPick</span>
        </a>
        <a class="storeButton" href="https://apps.apple.com/app/id6781131521" data-store-link>App Store</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div>
        <img class="icon" src="assets/app-icon.png" alt="">
        <h1 data-field="name">MinPick</h1>
        <p class="subtitle" data-field="subtitle">One step with the time you have.</p>
        <p class="promo" data-field="promotionalText"></p>
        <div class="heroActions">
          <a class="storeButton" href="https://apps.apple.com/app/id6781131521" data-store-link>View on the App Store</a>
          <details class="localeMenu" id="localeMenu">
            <summary class="localeMenuSummary" id="localeMenuSummary" aria-label="Language">
              <span id="localeCurrent">Language</span>
            </summary>
            <div class="localeMenuList" id="localeMenuList" role="menu" aria-label="Language"></div>
          </details>
        </div>
        <div class="error" id="errorMessage">The App Store metadata could not be loaded.</div>
      </div>

      <div class="featuredPhone">
        <img id="heroScreenshot" src="assets/StoreDockScreenshots/en-US/APP_IPHONE_67/01.png" alt="">
      </div>
    </section>

    <section class="screens" aria-label="Screenshots">
      <div class="screensGrid">
        <figure class="phone"><img data-shot="01" src="assets/StoreDockScreenshots/en-US/APP_IPHONE_67/01.png" alt=""></figure>
        <figure class="phone"><img data-shot="02" src="assets/StoreDockScreenshots/en-US/APP_IPHONE_67/02.png" alt=""></figure>
        <figure class="phone"><img data-shot="03" src="assets/StoreDockScreenshots/en-US/APP_IPHONE_67/03.png" alt=""></figure>
      </div>
    </section>

    <section class="overview">
      <h2 data-field="name">MinPick</h2>
      <div class="description" data-field="description"></div>
    </section>
  </main>

  <footer class="wrap">
    <div>© 2026 <span data-field="name">MinPick</span></div>
  </footer>

  <script>
    (() => {
      const APP_ID = "6781131521";
      const META_PATH = "assets/locales/appstore-metadata.json";
      const SHOT_ROOT = "assets/StoreDockScreenshots";
      const DEFAULT_LOCALE = "en-US";
      const RTL_BASES = new Set(["ar", "he", "ur"]);
      const LANGUAGE_NAMES = { ar:"العربية", de:"Deutsch", en:"English", es:"Español", fr:"Français", hi:"हिन्दी", id:"Bahasa Indonesia", it:"Italiano", ja:"日本語", ko:"한국어", nl:"Nederlands", pt:"Português", ru:"Русский", th:"ไทย", tr:"Türkçe", vi:"Tiếng Việt", zh:"中文" };

      const localeMenu = document.getElementById("localeMenu");
      const localeMenuSummary = document.getElementById("localeMenuSummary");
      const localeMenuList = document.getElementById("localeMenuList");
      const localeCurrent = document.getElementById("localeCurrent");
      const errorMessage = document.getElementById("errorMessage");
      let metadata = {};

      function normalizeLocale(value) {
        return String(value || "").replace("_", "-");
      }

      function localeCandidates(requested) {
        const normalized = normalizeLocale(requested);
        const base = normalized.split("-")[0];
        return [...new Set([normalized, base, DEFAULT_LOCALE, "en", "ja"])]
          .filter(Boolean)
          .filter(key => Object.prototype.hasOwnProperty.call(metadata, key));
      }

      function resolveLocale(requested) {
        return localeCandidates(requested)[0] || Object.keys(metadata)[0] || DEFAULT_LOCALE;
      }

      function setText(field, value) {
        if (!value) return;
        document.querySelectorAll(`[data-field="${field}"]`).forEach(node => {
          node.textContent = String(value).replace(/\\n/g, "\n").trim();
        });
      }

      function shortDescription(entry) {
        const source = entry.promotionalText || entry.subtitle || entry.description || "";
        return String(source).replace(/\\n/g, "\n").replace(/\s+/g, " ").trim().slice(0, 170);
      }

      function setMeta(selector, value) {
        const node = document.querySelector(selector);
        if (node && value) node.setAttribute("content", value);
      }

      function screenshotLocale(locale) {
        return locale;
      }

      function setImageWithFallback(img, locale, filename) {
        const preferred = `${SHOT_ROOT}/${screenshotLocale(locale)}/APP_IPHONE_67/${filename}.png`;
        const fallback = `${SHOT_ROOT}/${DEFAULT_LOCALE}/APP_IPHONE_67/${filename}.png`;
        img.onerror = () => {
          img.onerror = null;
          img.src = fallback;
        };
        img.src = preferred;
      }

      function applyLocale(locale) {
        const resolved = resolveLocale(locale);
        const entry = metadata[resolved];
        if (!entry) return;

        const base = resolved.split("-")[0];
        document.documentElement.lang = resolved;
        document.documentElement.dir = RTL_BASES.has(base) ? "rtl" : "ltr";
        document.documentElement.dataset.locale = resolved;

        setText("name", entry.name || "MinPick");
        setText("subtitle", entry.subtitle || "");
        setText("promotionalText", entry.promotionalText || "");
        setText("description", entry.description || "");

        const title = [entry.name, entry.subtitle].filter(Boolean).join(" — ");
        const summary = shortDescription(entry);
        document.title = title || "MinPick";
        setMeta('meta[name="description"]', summary);
        setMeta('meta[property="og:title"]', title);
        setMeta('meta[property="og:description"]', summary);

        const storeURL = `https://apps.apple.com/app/id${APP_ID}`;
        document.querySelectorAll("[data-store-link]").forEach(link => {
          link.href = storeURL;
        });

        document.querySelectorAll("[data-shot]").forEach(img => {
          setImageWithFallback(img, resolved, img.dataset.shot);
        });
        setImageWithFallback(document.getElementById("heroScreenshot"), resolved, "01");

        updateLocaleMenu(resolved);
        try { localStorage.setItem("MinPick.locale", resolved); } catch (_) {}
        history.replaceState(null, "", `${location.pathname}?locale=${encodeURIComponent(resolved)}`);
      }

      function languageName(locale) {
        const normalized = normalizeLocale(locale);
        const base = normalized.split("-")[0];
        const region = normalized.split("-")[1];
        const baseName = LANGUAGE_NAMES[base] || base.toUpperCase();
        return region ? `${baseName} (${region})` : baseName;
      }

      function updateLocaleMenu(resolved) {
        localeCurrent.textContent = languageName(resolved);
        localeMenuSummary.setAttribute("aria-label", `Language: ${languageName(resolved)}`);
        localeMenuList.querySelectorAll("[data-locale]").forEach(button => {
          button.setAttribute("aria-current", button.dataset.locale === resolved ? "true" : "false");
        });
      }

      function populateLocales() {
        localeMenuList.innerHTML = "";
        Object.keys(metadata).sort((a,b) => languageName(a).localeCompare(languageName(b))).forEach(locale => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "localeMenuButton";
          button.dataset.locale = locale;
          button.setAttribute("role", "menuitem");
          button.innerHTML = `<span class="localeMenuLabel"></span><span class="localeMenuCode"></span>`;
          button.querySelector(".localeMenuLabel").textContent = languageName(locale);
          button.querySelector(".localeMenuCode").textContent = locale;
          button.addEventListener("click", () => {
            applyLocale(locale);
            localeMenu.open = false;
            localeMenuSummary.focus();
          });
          localeMenuList.appendChild(button);
        });
      }

      async function run() {
        try {
          const response = await fetch(META_PATH, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          metadata = await response.json();
          populateLocales();

          const query = new URLSearchParams(location.search).get("locale");
          let saved = "";
          try { saved = localStorage.getItem("MinPick.locale") || ""; } catch (_) {}
          applyLocale(query || saved || navigator.language || DEFAULT_LOCALE);
        } catch (error) {
          console.error(error);
          errorMessage.style.display = "block";
        }
      }

      document.addEventListener("click", event => {
        if (!localeMenu.contains(event.target)) localeMenu.open = false;
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && localeMenu.open) {
          localeMenu.open = false;
          localeMenuSummary.focus();
        }
      });
      run();
    })();
  </script>
</body>
</html>
