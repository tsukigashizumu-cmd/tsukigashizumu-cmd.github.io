<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="referrer" content="same-origin">
  <title>Tsukigashizumu Studio</title>
  <script>
  (() => {
    'use strict';
    try {
      sessionStorage.removeItem('tsz-x-entry-v1');
      sessionStorage.setItem('tsz-s-entry-v1',JSON.stringify({
        v:1,source:'job_board',medium:'referral',campaign:'studio_jobs_v1',
        content:'listing',at:Date.now()
      }));
    } catch (_) { /* Site opens even if storage is restricted. */ }
    location.replace(new URL('../',location.href).href);
  })();
  </script>
</head>
<body>
  <p>Open <a href="../">Tsukigashizumu Studio</a>.</p>
</body>
</html>
